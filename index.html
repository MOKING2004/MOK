<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>برنامه هفتگی من</title>
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="برنامه من">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="manifestLink" href="data:application/manifest+json,{}">
<link rel="apple-touch-icon" id="appleIcon">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0f0f1a; --card:#1e1e35; --text:#e8e8f0;
    --muted:#8b8ba7; --border:#2d2d4a; --accent:#8b5cf6;
  }
  html { scroll-behavior:smooth; }
  body{
    font-family:'Vazirmatn',-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    padding:16px 12px 40px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(139,92,246,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(6,182,212,0.1) 0%, transparent 40%);
    background-attachment:fixed;
    overflow-wrap:break-word;
    word-break:break-word;
  }

  .header{ text-align:center; margin-bottom:16px; padding:8px 16px; }
  .header h1{
    font-size:22px; font-weight:800;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; margin-bottom:6px;
  }
  .header p{ font-size:12px; color:var(--muted); }

  /* ==== NOW BOX ==== */
  .now-box{
    background:linear-gradient(135deg,#1a1a2e,#252540);
    border-radius:24px; padding:18px; margin-bottom:20px;
    border:1px solid rgba(139,92,246,0.35);
    box-shadow:0 8px 32px rgba(139,92,246,0.18);
    position:relative; overflow:hidden;
  }
  .now-box::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,#8b5cf6,#06b6d4,#10b981,#8b5cf6);
    background-size:200% 100%;
    animation:shine 4s linear infinite;
  }
  @keyframes shine{ 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

  .now-header{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:12px; margin-bottom:14px;
    border-bottom:1px solid rgba(139,92,246,0.18);
    gap:8px; flex-wrap:wrap;
  }
  .now-day-wrap{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .now-day{
    font-size:14px; font-weight:700; color:#a78bfa;
    padding:4px 12px; background:rgba(139,92,246,0.12);
    border-radius:20px; display:inline-block; width:fit-content;
  }
  .now-date{
    font-size:11px; color:#8b8ba7; padding-right:4px;
  }
  .now-right{
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .now-time{
    font-size:26px; font-weight:800; color:#fff;
    font-variant-numeric:tabular-nums; letter-spacing:1px;
    background:linear-gradient(135deg,#fff,#a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .notif-btn{
    width:38px; height:38px; border-radius:12px;
    background:rgba(139,92,246,0.15);
    border:1px solid rgba(139,92,246,0.3);
    color:#a78bfa; font-size:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.2s ease; flex-shrink:0;
    font-family:inherit;
  }
  .notif-btn:active{ transform:scale(0.92); }
  .notif-btn.on{
    background:rgba(16,185,129,0.15);
    border-color:rgba(16,185,129,0.4);
    color:#34d399;
  }
  .notif-btn.off{ opacity:0.4; }

  .now-label{
    font-size:10px; font-weight:800; color:#a78bfa;
    letter-spacing:3px; margin-bottom:8px; padding-right:4px;
  }

  .now-activity{
    padding:14px; background:rgba(255,255,255,0.03);
    border-radius:16px; margin-bottom:10px;
    border-right:4px solid #8b5cf6;
    animation:fadeIn .35s ease;
  }
  .now-activity:last-child{ margin-bottom:0; }
  .now-activity.uni{ border-color:#8b5cf6; }
  .now-activity.lang{ border-color:#06b6d4; }
  .now-activity.sport{ border-color:#10b981; }
  .now-activity.work{ border-color:#f59e0b; }
  .now-activity.free{ border-color:#64748b; }
  .now-activity.sleep{ border-color:#475569; }
  .now-activity.meal{ border-color:#ec4899; }
  .now-activity.prep{ border-color:#94a3b8; }
  .now-activity.travel{ border-color:#f97316; }
  .now-activity.narges{ border-color:#ec4899; }

  .now-activity-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:8px; margin-bottom:6px; flex-wrap:wrap;
  }
  .now-activity-name{
    font-size:17px; font-weight:800; color:#fff;
    line-height:1.4; flex:1; min-width:0;
  }
  .now-activity-tag{
    font-size:10px; font-weight:700; color:#fbbf24;
    background:rgba(251,191,36,0.12);
    padding:3px 9px; border-radius:20px;
    flex-shrink:0; white-space:nowrap;
  }
  .now-activity-meta{
    font-size:12px; color:#8b8ba7; margin-bottom:10px;
  }
  .now-progress{
    height:6px; background:rgba(255,255,255,0.06);
    border-radius:3px; overflow:hidden; margin-bottom:6px;
  }
  .now-progress-bar{
    height:100%; border-radius:3px;
    transition:width 0.6s ease;
    background:linear-gradient(90deg,#8b5cf6,#06b6d4);
  }
  .now-progress-bar.uni{ background:linear-gradient(90deg,#6366f1,#8b5cf6); }
  .now-progress-bar.lang{ background:linear-gradient(90deg,#06b6d4,#0891b2); }
  .now-progress-bar.sport{ background:linear-gradient(90deg,#10b981,#059669); }
  .now-progress-bar.work{ background:linear-gradient(90deg,#f59e0b,#d97706); }
  .now-progress-bar.free{ background:linear-gradient(90deg,#64748b,#475569); }
  .now-progress-bar.sleep{ background:linear-gradient(90deg,#475569,#1e293b); }
  .now-progress-bar.meal{ background:linear-gradient(90deg,#f472b6,#ec4899); }
  .now-progress-bar.prep{ background:linear-gradient(90deg,#94a3b8,#64748b); }
  .now-progress-bar.travel{ background:linear-gradient(90deg,#fb923c,#f97316); }
  .now-progress-bar.narges{ background:linear-gradient(90deg,#ec4899,#be185d); }

  .now-progress-text{
    font-size:11px; color:#8b8ba7;
    display:flex; justify-content:space-between; align-items:center;
    gap:6px; flex-wrap:wrap;
  }
  .now-progress-text .rem{ color:#a78bfa; font-weight:600; }
  .now-progress-text .times{ font-variant-numeric:tabular-nums; direction:ltr; }

  .now-empty{
    text-align:center; padding:24px 12px;
    color:#8b8ba7; font-size:14px;
  }

  .now-nav{
    display:grid; grid-template-columns:1fr 1fr;
    gap:10px; margin-top:14px;
  }
  .now-nav-item{
    padding:12px; border-radius:14px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.06);
    position:relative; overflow:hidden;
    min-width:0;
  }
  .now-nav-item.prev{ border-right:3px solid #64748b; }
  .now-nav-item.next{ border-right:3px solid #8b5cf6; }
  .now-nav-label{
    font-size:10px; font-weight:800; color:#8b8ba7;
    letter-spacing:2px; margin-bottom:6px;
  }
  .now-nav-item.next .now-nav-label{ color:#a78bfa; }
  .now-nav-name{
    font-size:13px; font-weight:700; color:#fff;
    line-height:1.4; margin-bottom:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
  }
  .now-nav-time{
    font-size:10.5px; color:#8b8ba7;
    font-variant-numeric:tabular-nums;
    direction:rtl; text-align:right;
  }
  .now-nav-day{
    font-size:10px; color:#a78bfa; margin-top:3px; font-weight:600;
  }

  /* Tabs */
  .tabs{
    display:flex; gap:6px; overflow-x:auto;
    padding-bottom:8px; margin-bottom:16px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0; padding:10px 16px; border-radius:14px;
    background:var(--card); border:1px solid var(--border);
    color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; transition:all 0.25s ease;
    font-family:inherit; white-space:nowrap;
    position:relative;
  }
  .tab.active{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff; border-color:transparent;
    box-shadow:0 6px 20px rgba(139,92,246,0.4);
    transform:translateY(-2px);
  }
  .tab .tab-dot{
    position:absolute; top:6px; left:6px;
    width:6px; height:6px; border-radius:50%;
    background:#10b981;
    box-shadow:0 0 6px rgba(16,185,129,0.8);
    animation:tabPulse 1.5s ease-in-out infinite;
  }
  @keyframes tabPulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.6; transform:scale(1.3); }
  }

  .day{ display:none; animation:fadeIn 0.35s ease; }
  .day.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .day-title{
    font-size:16px; font-weight:700; margin-bottom:14px;
    padding-right:6px; display:flex; align-items:center;
    gap:8px; color:#fff;
  }
  .day-title::before{
    content:''; width:4px; height:20px; border-radius:4px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
  }

  .item{ display:flex; gap:12px; margin-bottom:10px; scroll-margin-top:120px; }
  .time-col{
    flex-shrink:0; width:78px;
    display:flex; flex-direction:column;
    align-items:flex-end; padding-top:12px;
  }
  .time{
    font-size:11.5px; font-weight:600; color:var(--muted);
    direction:ltr; font-variant-numeric:tabular-nums;
    letter-spacing:-0.3px;
  }
  .card{
    flex:1; padding:12px 14px; border-radius:16px;
    background:var(--card); border:1px solid var(--border);
    position:relative; overflow:hidden; transition:all 0.3s ease;
    min-width:0;
  }
  .card:active{ transform:scale(0.98); }
  .card::before{
    content:''; position:absolute; top:0; right:0;
    width:4px; height:100%;
  }
  .card.uni::before{ background:linear-gradient(135deg,#6366f1,#8b5cf6); }
  .card.lang::before{ background:linear-gradient(135deg,#06b6d4,#0891b2); }
  .card.sport::before{ background:linear-gradient(135deg,#10b981,#059669); }
  .card.work::before{ background:linear-gradient(135deg,#f59e0b,#d97706); }
  .card.free::before{ background:linear-gradient(135deg,#64748b,#475569); }
  .card.sleep::before{ background:linear-gradient(135deg,#1e293b,#0f172a); }
  .card.meal::before{ background:linear-gradient(135deg,#f472b6,#ec4899); }
  .card.prep::before{ background:linear-gradient(135deg,#94a3b8,#64748b); }
  .card.travel::before{ background:linear-gradient(135deg,#fb923c,#f97316); }
  .card.narges::before{ background:linear-gradient(135deg,#ec4899,#be185d); }

  /* active highlight in schedule */
  .item.active-now .card{
    background:linear-gradient(135deg, rgba(139,92,246,0.18), rgba(6,182,212,0.12));
    border-color:rgba(139,92,246,0.6);
    box-shadow:0 0 0 2px rgba(139,92,246,0.5), 0 8px 24px rgba(139,92,246,0.35);
    transform:scale(1.02);
    animation:activePulse 2.2s ease-in-out infinite;
  }
  .item.active-now .time{
    color:#a78bfa; font-weight:800;
  }
  @keyframes activePulse{
    0%,100%{ box-shadow:0 0 0 2px rgba(139,92,246,0.5), 0 8px 24px rgba(139,92,246,0.35); }
    50%{ box-shadow:0 0 0 3px rgba(167,139,250,0.8), 0 8px 32px rgba(139,92,246,0.55); }
  }
  .item.active-now .card::after{
    content:'▶ الان';
    position:absolute; top:8px; left:8px;
    font-size:9.5px; font-weight:800;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    color:#fff; padding:3px 8px; border-radius:20px;
    letter-spacing:0.5px;
  }

  .card .name{
    font-size:13.5px; font-weight:600; color:#fff;
    line-height:1.5; margin-bottom:3px;
  }
  .card .meta{ font-size:11.5px; color:var(--muted); line-height:1.5; }

  .legend{
    margin-top:24px; padding:16px;
    background:var(--card); border-radius:18px;
    border:1px solid var(--border);
  }
  .legend h3{ font-size:13px; font-weight:700; margin-bottom:12px; color:#fff; }
  .legend-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .legend-item{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; color:var(--muted);
  }
  .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .dot.uni{ background:linear-gradient(135deg,#6366f1,#8b5cf6); }
  .dot.lang{ background:linear-gradient(135deg,#06b6d4,#0891b2); }
  .dot.sport{ background:linear-gradient(135deg,#10b981,#059669); }
  .dot.work{ background:linear-gradient(135deg,#f59e0b,#d97706); }
  .dot.free{ background:linear-gradient(135deg,#64748b,#475569); }
  .dot.sleep{ background:linear-gradient(135deg,#1e293b,#0f172a); border:1px solid #334155; }
  .dot.meal{ background:linear-gradient(135deg,#f472b6,#ec4899); }
  .dot.narges{ background:linear-gradient(135deg,#ec4899,#be185d); }

  .footer{
    text-align:center; margin-top:24px;
    font-size:11px; color:var(--muted); line-height:1.8;
  }
  .footer strong{ color:#a78bfa; }

  /* toast */
  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:linear-gradient(135deg,#1e1e35,#252540);
    border:1px solid rgba(139,92,246,0.4);
    padding:12px 20px; border-radius:14px;
    font-size:13px; color:#fff; font-weight:600;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
    transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    z-index:1000; max-width:calc(100% - 40px);
    text-align:center;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <h1>برنامه هفتگی من</h1>
  <p>با نرگس می‌رویم و برمی‌گردیم</p>
</div>

<div class="now-box" id="nowBox">
  <div class="now-header">
    <div class="now-day-wrap">
      <span class="now-day" id="nowDay">—</span>
      <span class="now-date" id="nowDate">—</span>
    </div>
    <div class="now-right">
      <span class="now-time" id="nowTime">—:—</span>
      <button class="notif-btn" id="notifBtn" title="یادآوری">🔔</button>
    </div>
  </div>

  <div class="now-label">الان</div>
  <div id="nowCurrent"></div>

  <div class="now-nav">
    <div class="now-nav-item prev">
      <div class="now-nav-label">قبلی</div>
      <div id="nowPrev"><div class="now-nav-name">—</div></div>
    </div>
    <div class="now-nav-item next">
      <div class="now-nav-label">بعدی</div>
      <div id="nowNext"><div class="now-nav-name">—</div></div>
    </div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-day="sat">شنبه</button>
  <button class="tab" data-day="sun">یکشنبه</button>
  <button class="tab" data-day="mon">دوشنبه</button>
  <button class="tab" data-day="tue">سه‌شنبه</button>
  <button class="tab" data-day="wed">چهارشنبه</button>
  <button class="tab" data-day="thu">پنجشنبه</button>
  <button class="tab" data-day="fri">جمعه</button>
</div>

<div class="day active" id="sat"></div>
<div class="day" id="sun"></div>
<div class="day" id="mon"></div>
<div class="day" id="tue"></div>
<div class="day" id="wed"></div>
<div class="day" id="thu"></div>
<div class="day" id="fri"></div>

<div class="legend">
  <h3>راهنمای رنگ‌ها</h3>
  <div class="legend-grid">
    <div class="legend-item"><span class="dot uni"></span>کلاس دانشگاه</div>
    <div class="legend-item"><span class="dot lang"></span>زبان (مجازی)</div>
    <div class="legend-item"><span class="dot sport"></span>ورزش</div>
    <div class="legend-item"><span class="dot work"></span>مغازه</div>
    <div class="legend-item"><span class="dot free"></span>آزاد</div>
    <div class="legend-item"><span class="dot sleep"></span>خواب</div>
    <div class="legend-item"><span class="dot meal"></span>وعده غذایی</div>
    <div class="legend-item"><span class="dot narges"></span>کلاس نرگس</div>
  </div>
</div>

<div class="footer">
  <strong>حضور پدر:</strong> یکشنبه کامل، دوشنبه عصر، سه‌شنبه صبح، چهارشنبه عصر — ۲۰ ساعت در هفته<br>
  جمع ورزش: ۱۴ ساعت | جمع خواب: ۵۶ ساعت
</div>

<div class="toast" id="toast"></div>

const dayOrder = ['sat','sun','mon','tue','wed','thu','fri'];
const dayNames = {
  sat:'شنبه', sun:'یکشنبه', mon:'دوشنبه', tue:'سه‌شنبه',
  wed:'چهارشنبه', thu:'پنجشنبه', fri:'جمعه'
};
const WEEK = 10080;

/* ================== HELPERS ================== */
function fa(s){
  return String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}
function toMin(s){
  const [h,m] = s.split(':').map(Number);
  return h*60 + m;
}
function durOf(start, end){
  const s = toMin(start);
  const e = toMin(end);
  return e > s ? e - s : (1440 - s) + e;
}
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ================== RENDER DAYS ================== */
function renderDay(dayKey){
  const el = document.getElementById(dayKey);
  const rows = scheduleData[dayKey].map(([start, end, name, meta, type]) => `
    <div class="item" data-start="${start}" data-end="${end}" data-day="${dayKey}">
      <div class="time-col">
        <div class="time">${fa(start)}<br>${fa(end)}</div>
      </div>
      <div class="card ${type}">
        <div class="name">${name}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
      </div>
    </div>
  `).join('');
  el.innerHTML = `<div class="day-title">${dayNames[dayKey]}</div>${rows}`;
}
dayOrder.forEach(renderDay);

/* ================== FLAT LIST ================== */
const flat = [];
dayOrder.forEach((day, i) => {
  const offset = i * 1440;
  scheduleData[day].forEach(([start, end, name, meta, type]) => {
    const s = toMin(start);
    const dur = durOf(start, end);
    flat.push({
      absStart: offset + s,
      absEnd: offset + s + dur,
      name, meta, type, day,
      startStr: start, endStr: end,
      crosses: toMin(end) <= toMin(start)
    });
  });
});

/* ================== NOW LOGIC ================== */
function getEffectiveRange(item, now){
  for (const off of [0, -WEEK, WEEK]){
    const s = item.absStart + off;
    const e = item.absEnd + off;
    if (now >= s && now < e) return { start: s, end: e };
  }
  return null;
}

function findActive(now){
  return flat
    .map(it => ({ it, r: getEffectiveRange(it, now) }))
    .filter(x => x.r !== null);
}

function findPrev(now, activeSet){
  let best = null, bestDelta = Infinity;
  flat.forEach(it => {
    if (activeSet.has(it)) return;
    for (const off of [0, -WEEK, WEEK]){
      const e = it.absEnd + off;
      const d = now - e;
      if (d >= 0 && d < bestDelta){ bestDelta = d; best = it; }
    }
  });
  return best;
}

function findNext(now, activeSet){
  let best = null, bestDelta = Infinity;
  flat.forEach(it => {
    if (activeSet.has(it)) return;
    for (const off of [0, -WEEK, WEEK]){
      const s = it.absStart + off;
      const d = s - now;
      if (d > 0 && d < bestDelta){ bestDelta = d; best = it; }
    }
  });
  return best ? { item: best, delta: bestDelta } : null;
}

function persianDate(){
  try {
    return new Intl.DateTimeFormat('fa-IR', {
      day: 'numeric', month: 'long', year: 'numeric'
    }).format(new Date());
  } catch(e){
    return '';
  }
}

/* ================== UPDATE NOW BOX ================== */
let lastActiveKey = '';

function updateNowBox(){
  const now = new Date();
  const dayIdx = (now.getDay() + 1) % 7;
  const nowMin = dayIdx * 1440 + now.getHours() * 60 + now.getMinutes();
  const currentDayKey = dayOrder[dayIdx];

  document.getElementById('nowDay').textContent = dayNames[currentDayKey];
  document.getElementById('nowDate').textContent = persianDate();
  document.getElementById('nowTime').textContent =
    fa(String(now.getHours()).padStart(2,'0')) + ':' +
    fa(String(now.getMinutes()).padStart(2,'0'));

  const active = findActive(nowMin);
  const activeSet = new Set(active.map(a => a.it));
  const prev = findPrev(nowMin, activeSet);
  const next = findNext(nowMin, activeSet);

  // Current
  const currentEl = document.getElementById('nowCurrent');
  let newKey = '';
  if (active.length === 0){
    currentEl.innerHTML = '<div class="now-empty">در این لحظه برنامه‌ای نداری 🌙</div>';
  } else {
    newKey = active.map(a => `${a.it.day}-${a.it.startStr}`).join('|');
    currentEl.innerHTML = active.map(({ it, r }) => {
      const dur = r.end - r.start;
      const elapsed = nowMin - r.start;
      const pct = Math.min(100, Math.max(0, (elapsed / dur) * 100));
      const remaining = r.end - nowMin;
      const remH = Math.floor(remaining / 60);
      const remM = remaining % 60;
      const remStr = remH > 0
        ? `${fa(remH)} ساعت و ${fa(remM)} دقیقه`
        : `${fa(remM)} دقیقه`;
      const timeRange = fa(it.startStr) + ' تا ' + fa(it.endStr);
      const fromOtherDay = it.day !== currentDayKey
        ? `<span class="now-activity-tag">از ${dayNames[it.day]}</span>`
        : '';
      return `
        <div class="now-activity ${it.type}">
          <div class="now-activity-head">
            <div class="now-activity-name">${it.name}</div>
            ${fromOtherDay}
          </div>
          ${it.meta ? `<div class="now-activity-meta">${it.meta}</div>` : ''}
          <div class="now-progress">
            <div class="now-progress-bar ${it.type}" style="width:${pct}%"></div>
          </div>
          <div class="now-progress-text">
            <span class="rem">${remStr} مانده</span>
            <span class="times">${timeRange}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // Prev
  const prevEl = document.getElementById('nowPrev');
  if (prev){
    prevEl.innerHTML = `
      <div class="now-nav-name">${prev.name}</div>
      <div class="now-nav-time">${fa(prev.startStr)} تا ${fa(prev.endStr)}</div>
      <div class="now-nav-day">${dayNames[prev.day]}</div>
    `;
  } else {
    prevEl.innerHTML = '<div class="now-nav-name">—</div>';
  }

  // Next
  const nextEl = document.getElementById('nowNext');
  if (next){
    const it = next.item;
    const delta = next.delta;
    const dh = Math.floor(delta / 60);
    const dm = delta % 60;
    const untilStr = dh > 0
      ? `تا ${fa(dh)} ساعت و ${fa(dm)} دقیقه دیگر`
      : `تا ${fa(dm)} دقیقه دیگر`;
    nextEl.innerHTML = `
      <div class="now-nav-name">${it.name}</div>
      <div class="now-nav-time">${fa(it.startStr)} تا ${fa(it.endStr)}</div>
      <div class="now-nav-day">${dayNames[it.day]} • ${untilStr}</div>
    `;
  } else {
    nextEl.innerHTML = '<div class="now-nav-name">—</div>';
  }

  // Auto-scroll if active changed
  if (newKey && newKey !== lastActiveKey){
    lastActiveKey = newKey;
    setTimeout(scrollToActiveIfNeeded, 200);
  } else if (!newKey){
    lastActiveKey = '';
  }

  // Tab dots
  document.querySelectorAll('.tab').forEach(tab => {
    tab.querySelector('.tab-dot')?.remove();
  });
  active.forEach(({ it }) => {
    const tabEl = document.querySelector(`.tab[data-day="${it.day}"]`);
    if (tabEl && !tabEl.querySelector('.tab-dot')){
      const dot = document.createElement('span');
      dot.className = 'tab-dot';
      tabEl.appendChild(dot);
    }
  });

  // Highlight in schedule
  highlightActiveInSchedule(nowMin);

  // Notifications
  checkNotifications(now, dayIdx, nowMin);
}

function highlightActiveInSchedule(nowMinInWeek){
  dayOrder.forEach((day, idx) => {
    const container = document.getElementById(day);
    if (!container) return;
    container.querySelectorAll('.item').forEach(item => {
      const s = toMin(item.dataset.start);
      const dur = durOf(item.dataset.start, item.dataset.end);
      const absStart = idx * 1440 + s;
      const absEnd = absStart + dur;
      const isNow =
        (nowMinInWeek >= absStart && nowMinInWeek < absEnd) ||
        (nowMinInWeek + WEEK >= absStart && nowMinInWeek + WEEK < absEnd);
      item.classList.toggle('active-now', isNow);
    });
  });
}

let lastScrolledKey = null;
function scrollToActiveIfNeeded(){
  const activeTab = document.querySelector('.tab.active');
  if (!activeTab) return;
  const dayKey = activeTab.dataset.day;
  const dayEl = document.getElementById(dayKey);
  if (!dayEl) return;
  const activeItem = dayEl.querySelector('.item.active-now');
  if (!activeItem) return;
  const key = `${dayKey}-${activeItem.dataset.start}`;
  if (key === lastScrolledKey) return;
  lastScrolledKey = key;
  const rect = activeItem.getBoundingClientRect();
  const target = window.pageYOffset + rect.top - 110;
  window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
}

/* ================== NOTIFICATIONS ================== */
const notifBtn = document.getElementById('notifBtn');

function updateNotifBtn(){
  if (!('Notification' in window)){
    notifBtn.style.display = 'none';
    return;
  }
  if (Notification.permission === 'granted'){
    notifBtn.classList.add('on');
    notifBtn.classList.remove('off');
    notifBtn.textContent = '🔔';
  } else if (Notification.permission === 'denied'){
    notifBtn.classList.add('off');
    notifBtn.classList.remove('on');
    notifBtn.textContent = '🔕';
  } else {
    notifBtn.classList.remove('on','off');
    notifBtn.textContent = '🔔';
  }
}

notifBtn.addEventListener('click', async () => {
  if (!('Notification' in window)){
    showToast('مرورگر تو نوتیفیکیشن پشتیبانی نمی‌کند');
    return;
  }
  if (Notification.permission === 'granted'){
    showToast('یادآوری فعال است ✓');
    return;
  }
  if (Notification.permission === 'denied'){
    showToast('ابتدا از تنظیمات مرورگر اجازه بده');
    return;
  }
  const perm = await Notification.requestPermission();
  updateNotifBtn();
  if (perm === 'granted'){
    showToast('یادآوری فعال شد ✓');
    new Notification('یادآوری فعال شد', {
      body: '۱۰ دقیقه قبل از هر برنامه بهت اطلاع می‌دهم',
      dir: 'rtl', lang: 'fa'
    });
  }
});

function getNotifiedToday(){
  const today = new Date().toDateString();
  try {
    const saved = JSON.parse(localStorage.getItem('notified') || '{}');
    if (saved.date === today) return new Set(saved.items || []);
  } catch(e){}
  return new Set();
}
function markNotified(key){
  const today = new Date().toDateString();
  const set = getNotifiedToday();
  set.add(key);
  localStorage.setItem('notified', JSON.stringify({
    date: today, items: Array.from(set)
  }));
}

function checkNotifications(now, dayIdx, nowMin){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const currentDayKey = dayOrder[dayIdx];
  const notified = getNotifiedToday();
  scheduleData[currentDayKey].forEach(([start, end, name, meta]) => {
    const s = toMin(start);
    const diff = s - nowMin;
    if (diff === 10){
      const key = `${currentDayKey}-${start}-${name}`;
      if (notified.has(key)) return;
      markNotified(key);
      try {
        new Notification(`۱۰ دقیقه تا ${name}`, {
          body: meta || 'به‌زودی شروع می‌شه',
          tag: key, dir:'rtl', lang:'fa', renotify:true
        });
      } catch(e){}
    }
  });
}

/* ================== TABS ================== */
const tabs = document.querySelectorAll('.tab');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.day;
    tabs.forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.day').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(target).classList.add('active');
    localStorage.setItem('lastDay', target);
    lastScrolledKey = null;
    setTimeout(() => {
      scrollToActiveIfNeeded();
      if (!document.querySelector('.item.active-now')){
        window.scrollTo({ top: 0, behavior:'smooth' });
      }
    }, 80);
  });
});
